identity:
  name: "project_management"
  author: "denghuamin"
  label:
    en_US: "project manager"
    zh_Hans: "项目管理"
    pt_BR: "project manager"
    ja_JP: "project manager"
description:
  human:
    en_US: "Manage projects (list/add/delete)."
    zh_Hans: "管理项目：查看项目列表、新增项目、删除项目"
    pt_BR: "Gerenciar projetos (listar/adicionar/excluir)."
    ja_JP: "プロジェクトを管理（一覧/追加/削除）"
  llm: "Manage projects (add/list/delete)"
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
      zh_Hans: 指令
      pt_BR: Query
      ja_JP: クエリ
    human_description:
      en_US: "Command: list projects / add project / delete project"
      zh_Hans: "执行的指令：查看项目 / 新增项目 / 删除项目"
      pt_BR: "Comando: listar / adicionar / excluir"
      ja_JP: "コマンド（一覧/追加/削除）"
    llm_description: "supported commands: 新增项目, 查看项目, 删除项目"
    form: llm
  - name: project_name
    type: string
    required: false
    label:
      en_US: Project Name
      zh_Hans: 项目名称
      pt_BR: Project Name
      ja_JP: プロジェクト名
    human_description:
      en_US: "Required when adding or deleting a project."
      zh_Hans: "新增或删除项目时必填"
      pt_BR: "Obrigatório ao adicionar ou excluir."
      ja_JP: "追加/削除時に必須"
    llm_description: "Project name. Required for 新增项目 and 删除项目."
    form: llm
  - name: access_key
    type: string
    required: false
    label:
      en_US: Access Key
      zh_Hans: 项目密钥
      pt_BR: Chave de acesso
      ja_JP: アクセスキー
    human_description:
      en_US: "When adding: set as the permanent project key (cannot be changed later). When deleting: must match the stored key."
      zh_Hans: "新增项目时填写：将作为该项目的永久密钥，设置后不可更改，请妥善保管；删除项目时填写：必须与创建时设置的密钥一致"
      pt_BR: "Ao adicionar: define a chave permanente do projeto (imutável). Ao excluir: deve corresponder à chave armazenada."
      ja_JP: "追加時: プロジェクトの永続キーとして設定（変更不可）。削除時: 保存済みキーと一致する必要あり。"
    llm_description: "Project access key. When adding: becomes the permanent key. When deleting: must match stored key."
    form: llm
extra:
  python:
    source: tools/PM.py