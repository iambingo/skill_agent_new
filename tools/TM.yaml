identity:
  name: "skill_management"
  author: "denghuamin"
  label:
    en_US: "skill manager"
    zh_Hans: "技能管理"
    pt_BR: "skill manager"
    ja_JP: "skill manager"
description:
  human:
    en_US: "Manage local skill packages (add/delete/list)."
    zh_Hans: "管理本地 skills 技能包：新增/删除/查看"
    pt_BR: "Gerenciar pacotes de habilidades locais (adicionar/remover/visualizar)."
    ja_JP: "ローカルのスキルパッケージを管理（追加/削除/表示）"
  llm: "Manage local skill packages (add/delete/list)"
parameters:
  - name: project_name
    type: string
    required: true
    label:
      en_US: Project Name
      zh_Hans: 项目名称
      pt_BR: Project Name
      ja_JP: プロジェクト名
    human_description:
      en_US: "Project name used to namespace skills. Each project has its own isolated set of skills."
      zh_Hans: "项目名称，用于隔离不同项目的技能包，不同项目的技能互相独立"
      pt_BR: "Nome do projeto para isolar os pacotes de habilidades."
      ja_JP: "プロジェクト名。スキルを分離するために使用します。"
    llm_description: "Project name to namespace skills"
    form: form
  - name: command
    type: string
    required: true
    label:
      en_US: Command
      zh_Hans: 命令
      pt_BR: Command
      ja_JP: コマンド
    human_description:
      en_US: "supported commands: add, delete, list, detail"
      zh_Hans: "支持：查看技能、技能详情、新增技能、删除技能"
      pt_BR: "Gerenciar pacotes de habilidades locais (adicionar/remover/visualizar/detalhar)."
      ja_JP: "ローカルのスキルパッケージを管理（追加/削除/表示/詳細）"
    llm_description: "supported commands: add, delete, list, detail"
    form: llm
  - name: skill_name
    type: string
    required: false
    label:
      en_US: Skill Name
      zh_Hans: 技能名称
      pt_BR: Nome da skill
      ja_JP: スキル名
    human_description:
      en_US: "Required when deleting a skill. Must match the skill folder name exactly."
      zh_Hans: "删除技能时必填，填写技能名称（与技能文件夹名一致）"
      pt_BR: "Obrigatório ao excluir uma skill."
      ja_JP: "スキル削除時に必須。スキルフォルダ名と一致する必要があります。"
    llm_description: "Skill name to delete. Required for 删除技能."
    form: llm
  - name: access_key
    type: string
    required: false
    label:
      en_US: Access Key
      zh_Hans: 项目密钥
      pt_BR: Chave de acesso
      ja_JP: アクセスキー
    human_description:
      en_US: "Required for write operations (add/delete skill). Not needed for read operations (list/detail)."
      zh_Hans: "写操作（新增/删除技能）时必填；查看技能无需填写"
      pt_BR: "Obrigatório para operações de escrita. Não necessário para leitura."
      ja_JP: "書き込み操作時に必須。読み取り操作には不要。"
    llm_description: "Project access key. Required for 新增技能 and 删除技能."
    form: form
  - name: files
    type: files
    required: false
    label:
      en_US: Zip files
      zh_Hans: Zip压缩包
      pt_BR: Zip files
      ja_JP: Zipファイル
    human_description:
      en_US: "Zip package(s) for add command."
      zh_Hans: "新增技能时上传 zip 压缩包"
      pt_BR: "Zip package(s) for add command."
      ja_JP: "新增技能 用の zip"
    llm_description: "Zip package(s) for add command"
    form: form
extra:
  python:
    source: tools/TM.py
